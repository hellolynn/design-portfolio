<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body class="bg-white">

    <!-- Mobile Top Bar (visible on small screens only) -->
    <header class="d-md-none navbar navbar-light bg-white border-bottom px-3 py-2 sticky-top">
      <a class="navbar-brand fw-bold" href="{{ '/' | relative_url }}">Hello Lynn ↟</a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar" aria-controls="mobileSidebar" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
    </header>

    <!-- Mobile Offcanvas Sidebar -->
    <div class="offcanvas offcanvas-start d-md-none" tabindex="-1" id="mobileSidebar" aria-labelledby="mobileSidebarLabel">
      <div class="offcanvas-header border-bottom">
        <h6 class="offcanvas-title" id="mobileSidebarLabel"></h6>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body px-4 py-3">
        {% include navbar.html %}
      </div>
    </div>

    <!-- Desktop Fixed Sidebar (visible md and up) -->
    <nav class="d-none d-md-flex flex-column fixed-top border-end bg-white"
         style="width: 220px; height: 100vh; overflow-y: auto;">
      <div class="pt-4 ps-4 pe-3 h-100">
        {% include navbar.html %}
      </div>
    </nav>

    <!-- Main Content -->
    <main class="d-md-block {{ page.custom-class }}"
          style="margin-left: 0;">
      <!-- Offset for desktop sidebar -->
      <div class="d-none d-md-block" style="margin-left: 220px;">
        {{ content }}
      </div>
      <!-- Mobile content (no offset) -->
      <div class="d-md-none">
        {{ content }}
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
